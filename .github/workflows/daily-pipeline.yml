# 00981A：抓取 → 提交 holdings JSON → 發送 Telegram（單一 workflow）
# 排程：台灣 14:30（UTC 06:30）一次跑完（較原 16:30 提早 2 小時，預留 GitHub 排程排隊延遲）。
#
# 若「沒有自動跑」請檢查：
# - GitHub 只會用「預設分支」（通常是 main）上的此檔跑 schedule；請確認已 merge 且預設分支正確。
# - 倉庫 60 天無活動時，GitHub 可能停用排程；Actions 分頁左側可重新啟用。
# - Fork 的倉庫預設不跑 schedule；Settings → Actions → General 須允許 Actions。
# - 排程可能延遲數分鐘～一小時屬正常；可用手動 workflow_dispatch 驗證。
name: 00981A ETF 每日流程

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=抓取+提交+發送；fetch_only=僅抓取與提交；send_only=僅發送（會先 git pull）'
        type: choice
        options:
          - full
          - fetch_only
          - send_only
        default: full

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 若 Bot token 只放在 GitHub「Environments」：請取消下一行註解並改成你的環境名稱。
    # 勿使用「空白 environment」或動態 ${{ }} 綁 environment，否則可能讀不到 Repository 的 Actions Secrets。
    # environment: production

    env:
      SKIP_WEEKEND_SEND: ${{ secrets.SKIP_WEEKEND_SEND }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      TELEGRAM_CHAT_TOPIC_IDS_JSON: ${{ secrets.TELEGRAM_CHAT_TOPIC_IDS_JSON }}

    steps:
      # 直接把 secrets / vars 的「名稱清單」印出（值會被 GitHub 自動遮蔽為 ***）
      # 若這裡顯示空物件 {}，代表 GitHub 沒有把任何 secret 注入到此 run。
      - name: 診斷：列出此 run 看得到的 secrets / vars 名稱
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "== 此 run 看得到的 Repository / Organization SECRETS（值已遮蔽為 ***，僅顯示 key）=="
          printf '%s\n' "$ALL_SECRETS_JSON"
          echo
          echo "== 此 run 看得到的 VARS（變數，值會顯示）=="
          printf '%s\n' "$ALL_VARS_JSON"
          echo
          echo "註：若上面 SECRETS 是 {} 表示 GitHub 沒有把任何 secret 給此 run，"
          echo "    請去 Settings → Secrets and variables → Actions → Repository secrets 確認。"

      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: 同步遠端（僅 send_only）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'send_only' }}
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝 Python 依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Chrome（抓取需要）
        id: setup-chrome
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: 抓取持股
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          # pocket.tw 在 CI 常因憑證鏈導致 requests SSL 失敗；允許 requests 路徑重試
          ETF_REQUESTS_VERIFY_SSL: "0"
        run: |
          echo "▶ python main.py --fetch-only"
          python main.py --fetch-only

      - name: 提交 holdings JSON 到 repo
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holdings_data.json holdings_data_*.json 2>/dev/null || true
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "chore: 儲存每日持股數據 $(date +%Y-%m-%d)"
            BRANCH="${GITHUB_REF_NAME}"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              git pull --rebase origin "$BRANCH" || true
              if git push origin "$BRANCH"; then
                echo "已提交並推送持股 JSON"
                exit 0
              fi
              echo "::warning::push 被拒絕或失敗，第 ${attempt}/5 次重試（先 pull --rebase）..."
              sleep 10
            done
            echo "::error::push 多次失敗，請檢查是否與其他提交衝突"
            exit 1
          else
            echo "無新數據需提交"
          fi

      # 將 Bot token 寫入 GITHUB_ENV（多行語法），下一步的 python 才讀得到。
      # 失敗時會「同一格」印出 GitHub 此次注入的 secrets / vars 名稱（值已遮蔽為 ***）方便排查。
      - name: 準備 TELEGRAM_BOT_TOKEN（下一步 send-only 使用）
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fetch_only') }}
        env:
          _TG0: ${{ secrets['TELEGRAM_BOT_TOKEN'] }}
          _TG1: ${{ secrets['TELEGRAM_TOKEN'] }}
          _TG2: ${{ secrets['BOT_TOKEN'] }}
          _TG_VAR: ${{ vars['TELEGRAM_ACTIONS_BOT_TOKEN'] }}
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          echo "repo=${GITHUB_REPOSITORY} event=${{ github.event_name }}"
          TG="$(printf '%s' "${_TG0:-}" | tr -d '\r\n')"
          if [ -z "$TG" ]; then TG="$(printf '%s' "${_TG1:-}" | tr -d '\r\n')"; fi
          if [ -z "$TG" ]; then TG="$(printf '%s' "${_TG2:-}" | tr -d '\r\n')"; fi
          if [ -z "$TG" ]; then TG="$(printf '%s' "${_TG_VAR:-}" | tr -d '\r\n')"; fi
          if [ -z "$TG" ]; then
            echo "::error::此 run 讀不到 TELEGRAM_BOT_TOKEN／TELEGRAM_TOKEN／BOT_TOKEN。"
            echo ""
            echo "── 此 run 看得到的 SECRETS（key 可見，值已遮蔽為 ***） ──"
            printf '%s\n' "$ALL_SECRETS_JSON"
            echo "── 此 run 看得到的 VARS（變數，值會顯示） ──"
            printf '%s\n' "$ALL_VARS_JSON"
            echo ""
            echo "::notice::Secrets 設定頁: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo "::error::A) 若上方 SECRETS 是 {}：完全沒注入。請去 Settings → Secrets and variables → Actions → Secrets（不是 Variables）新增 TELEGRAM_BOT_TOKEN"
            echo "::error::B) 若有看到別的 secret 但沒有 TELEGRAM_BOT_TOKEN：名稱不一致，刪掉重建（須完全等於 TELEGRAM_BOT_TOKEN）"
            echo "::error::C) 若 token 在 GitHub Environment：在 jobs.daily 下取消註解 environment: <你的環境名>"
            echo "::error::D) Org secret 對 Free org + private repo 不可見；請改建 Repository secret"
            exit 1
          fi
          {
            echo "TELEGRAM_BOT_TOKEN<<__TG_EOF__"
            printf '%s' "$TG"
            echo ""
            echo "__TG_EOF__"
          } >> "$GITHUB_ENV"
          echo "::notice::已寫入 TELEGRAM_BOT_TOKEN 供下一步使用（內容不會印出）。"

      - name: 發送 Telegram（send-only）
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fetch_only') }}
        run: |
          echo "▶ python main.py --send-only"
          python main.py --send-only

      - name: 上傳數據備份
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdings-data
          path: holdings_data*.json
          retention-days: 30
