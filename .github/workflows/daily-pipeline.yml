# 00981A：抓取 → 提交 holdings JSON → 發送 Telegram（單一 workflow）
# 排程：台灣 16:30（UTC 08:30）一次跑完；不再與第二個 cron 分檔，避免多 schedule 誤判。
name: 00981A ETF 每日流程

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=抓取+提交+發送；fetch_only=僅抓取與提交；send_only=僅發送（會先 git pull）'
        type: choice
        options:
          - full
          - fetch_only
          - send_only
        default: full

# 各 step 共用（避免每步重複 env 區塊）
env:
  SKIP_WEEKEND_SEND: ${{ secrets.SKIP_WEEKEND_SEND }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
  TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
  TELEGRAM_CHAT_TOPIC_IDS_JSON: ${{ secrets.TELEGRAM_CHAT_TOPIC_IDS_JSON }}

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 若 Bot token 放在 GitHub Environments 的 secrets，請取消註解並改成你的環境名稱：
    # environment: production

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: ${{ github.ref }}

    - name: 同步遠端（僅 send_only）
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'send_only' }}
      run: git pull --ff-only origin "${{ github.ref_name }}"

    - name: 設定 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 安裝 Python 依賴
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安裝 Chrome（抓取需要）
      id: setup-chrome
      if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-chromedriver: true
        install-dependencies: true

    - name: 抓取持股
      if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
      run: |
        echo "▶ python main.py --fetch-only"
        python main.py --fetch-only

    - name: 提交 holdings JSON 到 repo
      if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'send_only') }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add holdings_data.json holdings_data_*.json 2>/dev/null || true
        if ! git diff --staged --quiet 2>/dev/null; then
          git commit -m "chore: 儲存每日持股數據 $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || true
            if git push origin "$BRANCH"; then
              echo "已提交並推送持股 JSON"
              exit 0
            fi
            echo "::warning::push 被拒絕或失敗，第 ${attempt}/5 次重試（先 pull --rebase）..."
            sleep 10
          done
          echo "::error::push 多次失敗，請檢查是否與其他提交衝突"
          exit 1
        else
          echo "無新數據需提交"
        fi
      continue-on-error: true

    - name: 發送 Telegram
      if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fetch_only') }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
          echo "::error::找不到 Bot Token。請在 Actions → Secrets 建立 TELEGRAM_BOT_TOKEN（或 TELEGRAM_TOKEN / BOT_TOKEN）。若 secrets 放在 Environment，請在本 job 加上 environment: <環境名>。"
          exit 1
        fi
        echo "▶ python main.py --send-only"
        python main.py --send-only

    - name: 上傳數據備份
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: holdings-data
        path: holdings_data*.json
        retention-days: 30
