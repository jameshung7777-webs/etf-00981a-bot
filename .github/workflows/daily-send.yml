name: 00981A ETF 每日發送（17:00 台灣）

on:
  schedule:
    # 台灣時間 17:00 = UTC 09:00（比抓取晚 30 分鐘，確保 JSON 已存入 repo）
    - cron: '0 9 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 檢出程式碼（含最新 holdings JSON）
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 設定 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安裝依賴（只需 requests 等，不需 Chrome）
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 隨機延遲（防止固定時間被偵測）
      run: |
        DELAY=$((RANDOM % 600 + 60))
        echo "隨機等待 ${DELAY} 秒（共 $(( DELAY / 60 )) 分 $(( DELAY % 60 )) 秒）..."
        sleep $DELAY

    - name: 執行發送
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
      run: python main.py --send-only
