name: 00981A ETF 每日抓取（16:30 台灣）

on:
  schedule:
    # 台灣時間 16:30 = UTC 08:30
    - cron: '30 8 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 設定 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安裝依賴
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安裝 Chrome（GitHub Actions 專用）
      id: setup-chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-chromedriver: true
        install-dependencies: true

    - name: 隨機延遲（防止固定時間被偵測）
      run: |
        DELAY=$((RANDOM % 600 + 60))
        echo "隨機等待 ${DELAY} 秒（共 $(( DELAY / 60 )) 分 $(( DELAY % 60 )) 秒）..."
        sleep $DELAY

    - name: 執行抓取
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
      run: python main.py --fetch-only

    - name: 提交 holdings 數據到 repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add holdings_data.json holdings_data_*.json 2>/dev/null || true
        if ! git diff --staged --quiet 2>/dev/null; then
          git commit -m "chore: 儲存每日持股數據 $(date +%Y-%m-%d)"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          echo "已提交並推送持股 JSON 檔"
        else
          echo "無新數據需提交"
        fi
      continue-on-error: true

    - name: 上傳數據備份
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: holdings-data
        path: holdings_data*.json
        retention-days: 30
