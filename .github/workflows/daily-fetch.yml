# 僅負責抓取並提交 JSON（台灣 16:30 = UTC 08:30）
# 與發送分檔，避免多個 schedule 時無法辨識 cron 而兩趟都變成 fetch-only
name: 00981A ETF 每日抓取

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: '抓取後立刻發送（等同 python main.py --now）'
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 設定 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安裝 Python 依賴
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 安裝 Chrome（抓取需要）
      id: setup-chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable
        install-chromedriver: true
        install-dependencies: true

    - name: 執行抓取（或抓取+發送）
      env:
        SKIP_WEEKEND_SEND: ${{ secrets.SKIP_WEEKEND_SEND }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_pipeline }}" = "true" ]; then
          echo "▶ 模式：--now（抓取並發送）"
          python main.py --now
        else
          echo "▶ 模式：fetch-only（固定）"
          python main.py --fetch-only
        fi

    - name: 提交 holdings JSON 到 repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add holdings_data.json holdings_data_*.json 2>/dev/null || true
        if ! git diff --staged --quiet 2>/dev/null; then
          git commit -m "chore: 儲存每日持股數據 $(date +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git pull --rebase origin "$BRANCH" || true
            if git push origin "$BRANCH"; then
              echo "已提交並推送持股 JSON"
              exit 0
            fi
            echo "::warning::push 被拒絕或失敗，第 ${attempt}/5 次重試（先 pull --rebase）..."
            sleep 10
          done
          echo "::error::push 多次失敗，請檢查是否與其他提交衝突"
          exit 1
        else
          echo "無新數據需提交"
        fi
      continue-on-error: true

    - name: 上傳數據備份
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: holdings-data
        path: holdings_data*.json
        retention-days: 30
